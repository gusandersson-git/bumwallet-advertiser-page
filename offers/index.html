<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BumWallet Offers</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f5; color: #111; }
  header { padding: 16px; background: #fff; border-bottom: 1px solid #ddd; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header h1 { font-size: 18px; margin: 0; flex: 1 1 100%; }
  header input { flex: 1 1 160px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
  header button { padding: 10px 16px; font-size: 16px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  #status { color: #555; margin-bottom: 12px; }
  .offer { display: flex; gap: 12px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 10px; text-decoration: none; color: inherit; }
  .offer img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex: 0 0 56px; background: #eee; }
  .offer .info { flex: 1; min-width: 0; }
  .offer .name { font-weight: 600; margin: 0 0 4px; }
  .offer .desc { font-size: 14px; color: #555; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .offer .points { font-weight: 700; color: #1a7f37; white-space: nowrap; align-self: center; }
  .offer .goals { font-size: 13px; color: #555; margin: 6px 0 0; padding-left: 16px; }
</style>
</head>
<body>
<header>
  <h1>BumWallet Offers</h1>
  <input id="passID" placeholder="Wallet pass ID" value="testuser1">
  <button id="load">Load offers</button>
</header>
<main>
  <div id="status"></div>
  <div id="list"></div>
</main>
<script>
  const status = document.getElementById("status");
  const list = document.getElementById("list");

  function fmtPoints(o) {
    if (o.variable) return "Varies";
    if (o.points == null) return "";
    return o.points + " Bum Points";
  }

  function render(offers) {
    list.innerHTML = "";
    for (const o of offers) {
      const a = document.createElement("a");
      a.className = "offer";
      a.href = o.link;
      a.target = "_blank";
      a.rel = "noopener";

      let goals = "";
      if (o.goals && o.goals.length) {
        goals = "<ul class=\"goals\">" + o.goals.map(g => "<li>" + g.description + ": " + g.points + "</li>").join("") + "</ul>";
      }

      a.innerHTML =
        "<img src=\"" + o.image + "\" alt=\"\">" +
        "<div class=\"info\"><p class=\"name\"></p><p class=\"desc\"></p>" + goals + "</div>" +
        "<div class=\"points\">" + fmtPoints(o) + "</div>";
      a.querySelector(".name").textContent = o.name;
      a.querySelector(".desc").textContent = o.description || "";
      list.appendChild(a);
    }
  }

  async function load() {
    const passID = document.getElementById("passID").value.trim();
    if (!passID) { status.textContent = "Enter a pass ID"; return; }
    status.textContent = "Loading";
    list.innerHTML = "";
    try {
      const r = await fetch("/api/lootably-offers?passID=" + encodeURIComponent(passID));
      const j = await r.json();
      if (!r.ok) { status.textContent = "Error: " + (j.error || r.status); return; }
      status.textContent = j.count + " offers";
      render(j.offers);
    } catch (e) {
      status.textContent = "Request failed";
    }
  }

  document.getElementById("load").addEventListener("click", load);
  load();
</script>
</body>
</html>
