<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BumWallet Offers</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f5; color: #111; }
  header { padding: 16px; background: #fff; border-bottom: 1px solid #ddd; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header h1 { font-size: 18px; margin: 0; flex: 1 1 100%; }
  header input { flex: 1 1 160px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
  header button { padding: 10px 16px; font-size: 16px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  #status { color: #555; margin-bottom: 12px; }
  .offer { display: flex; gap: 12px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 10px; text-decoration: none; color: inherit; }
  .offer img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex: 0 0 56px; background: #eee; }
  .offer .info { flex: 1; min-width: 0; }
  .offer .name { display: block; font-weight: 600; margin: 0 0 4px; color: inherit; text-decoration: none; }
  .offer img { cursor: pointer; }
  .offer .desc { font-size: 14px; color: #555; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .offer .points { font-weight: 700; color: #1a7f37; white-space: nowrap; align-self: center; }
  .offer .points small { display: block; font-size: 11px; font-weight: 400; color: #555; }
  .offer details { font-size: 13px; color: #555; margin-top: 6px; }
  .offer summary { cursor: pointer; }
  .offer .goals { margin: 4px 0 0; padding-left: 16px; }
  .offer .goals li { display: flex; justify-content: space-between; gap: 8px; }
</style>
</head>
<body>
<header>
  <h1>BumWallet Offers</h1>
  <input id="passID" placeholder="Wallet pass ID" value="testuser1">
  <button id="load">Load offers</button>
</header>
<main>
  <div id="status"></div>
  <div id="list"></div>
</main>
<script>
  const status = document.getElementById("status");
  const list = document.getElementById("list");

  function num(n) {
    return Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
  }

  function usd(points) {
    return "$" + (Number(points) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtPoints(o) {
    if (o.variable) return "Varies";
    if (o.points == null) return "";
    const prefix = o.goals && o.goals.length ? "<small>Up to</small>" : "";
    return prefix + num(o.points) + "<small>" + usd(o.points) + " user / " + usd(o.revenue * 100) + " revenue</small>";
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
  }

  function render(offers) {
    list.innerHTML = "";
    for (const o of offers) {
      const card = document.createElement("div");
      card.className = "offer";

      let goals = "";
      if (o.goals && o.goals.length) {
        goals =
          "<details><summary>" + o.goals.length + " steps</summary><ul class=\"goals\">" +
          o.goals.map(g => "<li><span>" + esc(g.description) + "</span><span>" + num(g.points) + " (" + usd(g.points) + ")</span></li>").join("") +
          "</ul></details>";
      }

      card.innerHTML =
        "<img src=\"" + esc(o.image) + "\" alt=\"\">" +
        "<div class=\"info\"><a class=\"name\" target=\"_blank\" rel=\"noopener\"></a><p class=\"desc\"></p>" + goals + "</div>" +
        "<div class=\"points\">" + fmtPoints(o) + "<small>Bum Points</small></div>";
      const name = card.querySelector(".name");
      name.textContent = o.name;
      name.href = o.link;
      card.querySelector(".desc").textContent = o.description || "";
      card.querySelector("img").addEventListener("click", () => window.open(o.link, "_blank", "noopener"));
      list.appendChild(card);
    }
  }

  async function load() {
    const passID = document.getElementById("passID").value.trim();
    if (!passID) { status.textContent = "Enter a pass ID"; return; }
    status.textContent = "Loading";
    list.innerHTML = "";
    try {
      const r = await fetch("/api/lootably-offers?passID=" + encodeURIComponent(passID));
      const j = await r.json();
      if (!r.ok) { status.textContent = "Error: " + (j.error || r.status); return; }
      status.textContent = j.count + " offers";
      render(j.offers);
    } catch (e) {
      status.textContent = "Request failed";
    }
  }

  document.getElementById("load").addEventListener("click", load);
  load();
</script>
</body>
</html>
